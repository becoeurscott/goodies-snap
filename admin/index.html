<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>goodiesSnap Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,1000&display=swap">
<style>
  :root{
    /* Dark control room, matching the reference — the app's yellow stays the one accent. */
    --ink:#F4F0E4; --ink-2:#CBC3AE; --muted:#8B8371;
    --paper:#0C0B08; --card:#161309; --card-2:#1C180D; --fill:#221D12;
    --line:#2A2417; --line-soft:#211C11;
    --yellow:#FFC400; --yellow-soft:#FFE49A; --yellow-dim:#5A4A12; --amber:#EFC15C; --black:#0B0A06;
    --ok:#63C182; --ok-bg:#16301F;
    --warn:#E0A85A; --warn-bg:#2E2413;
    --stop:#F08373; --stop-bg:#331915;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.35);
    --sans:"Nunito Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  a{color:var(--yellow)}

  /* sign-in */
  #gate{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  #gate .card{width:100%;max-width:380px;padding:28px}
  #gate h1{font-size:22px;font-weight:1000;margin:0 0 4px;letter-spacing:-.02em}
  #gate p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 5px}
  input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--fill);color:var(--ink);font-size:14.5px;font-family:inherit}
  input:focus{outline:none;border-color:var(--yellow)}
  .btn{border:0;background:var(--yellow);color:#000;padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:6px 13px}
  .btn.danger{background:transparent;border:1px solid var(--stop);color:var(--stop);font-size:12px;padding:5px 12px}
  #gate .btn{width:100%;margin-top:20px}
  .err{margin-top:12px;font-size:13px;color:var(--stop);background:var(--stop-bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}

  /* shell */
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:var(--card);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 8px 0}
  .brand .logo{width:40px;height:40px;border-radius:12px;background:var(--yellow);color:#000;font-weight:1000;display:grid;place-items:center;font-size:18px;flex:none}
  .brand b{font-weight:1000;font-size:15.5px;letter-spacing:-.01em;display:block}
  .brand small{display:block;color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
  nav{display:flex;flex-direction:column;gap:3px;margin-top:26px}
  nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:var(--ink-2);font-size:13.5px;font-weight:700}
  nav button .ic{width:18px;height:18px;flex:none;opacity:.85}
  nav button:hover{background:var(--fill);color:var(--ink)}
  nav button[aria-current="true"]{background:var(--yellow);color:#000}
  nav button[aria-current="true"] .ic{opacity:1}
  .spacer{flex:1}
  aside .out{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:var(--stop);font-weight:800;font-size:13.5px;cursor:pointer;border:0;background:transparent;width:100%}
  aside .out .ic{width:18px;height:18px;flex:none}
  aside .out:hover{background:var(--stop-bg)}
  aside .who{color:var(--muted);font-size:11px;padding:12px 10px 6px}
  aside .who b{color:var(--ink-2);display:block;font-size:12.5px}
  main{padding:0 0 60px;min-width:0}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:5;background:rgba(12,11,8,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
          display:flex;align-items:center;gap:16px;padding:16px 26px}
  .topbar h1{font-size:20px;font-weight:1000;letter-spacing:-.02em;margin:0}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin:1px 0 0}
  .chip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:var(--fill);border:1px solid var(--line);color:var(--ink-2);
        font-size:12.5px;font-weight:800;padding:8px 14px;border-radius:999px}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--yellow);color:#000;font-weight:1000;display:grid;place-items:center;font-size:14px}
  .wrap{padding:22px 26px 0}

  /* overview grid */
  .row{display:grid;gap:14px;margin-bottom:14px}
  .row.two{grid-template-columns:1.35fr 1fr}
  .row.tiles{grid-template-columns:repeat(4,1fr)}
  .row.bottom{grid-template-columns:1.4fr 1fr}
  @media (max-width:980px){ .row.two,.row.bottom{grid-template-columns:1fr} .row.tiles{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:820px){ .shell{grid-template-columns:1fr} aside{position:static;height:auto;flex-direction:column} nav{flex-direction:row;flex-wrap:wrap} .spacer{display:none} }

  .pad{padding:20px}
  .cap{font-size:13.5px;font-weight:800;color:var(--ink)}
  .cap .mut{color:var(--muted);font-weight:700}
  .big{font-size:34px;font-weight:1000;letter-spacing:-.03em;margin:6px 0 2px}
  .delta{font-size:12.5px;font-weight:800}
  .delta.up{color:var(--ok)} .delta.down{color:var(--stop)}

  /* bar chart */
  .bars{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:18px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
  .bars .bar{width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--yellow),var(--yellow-dim));min-height:4px;transition:height .5s ease}
  .bars .bar.soft{background:linear-gradient(180deg,var(--yellow-soft),rgba(255,196,0,.10))}
  .bars .lbl{font-size:11px;color:var(--muted);font-weight:700}

  /* donut */
  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
  .donut{position:relative;width:190px;height:190px}
  .donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .donut .mid .n{font-size:30px;font-weight:1000;letter-spacing:-.02em}
  .donut .mid .t{font-size:11.5px;color:var(--muted);font-weight:700}
  .legend{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px 16px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .legend .sw{width:9px;height:9px;border-radius:50%;flex:none}
  .legend .nm{font-weight:700;color:var(--ink-2)}
  .legend .pc{margin-left:auto;font-weight:800;color:var(--muted)}

  /* tiles */
  .tile{padding:16px 17px}
  .tile .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .tile .v{font-size:27px;font-weight:1000;letter-spacing:-.02em;margin-top:6px}
  .tile .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .tile .d.req{color:var(--stop);font-weight:800}

  /* alert bars */
  .alerts{display:flex;flex-direction:column;gap:15px}
  .alert .top{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
  .alert .top .r{color:var(--muted);font-weight:700}
  .track{height:7px;border-radius:999px;background:var(--fill);overflow:hidden}
  .track > span{display:block;height:100%;border-radius:999px;background:var(--yellow)}

  /* panels & tables */
  .panel{overflow:hidden}
  .panel-h{padding:16px 20px;display:flex;align-items:center;gap:10px}
  .panel-h h2{font-size:14.5px;font-weight:900;margin:0}
  .panel-h .note{margin-left:auto;font-size:12px;color:var(--muted)}
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
  th,td{padding:11px 20px;text-align:right;border-top:1px solid var(--line-soft);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;border-top:0}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
  .p-free{background:var(--fill);color:var(--ink-2)}
  .p-plus{background:var(--yellow-dim);color:var(--yellow-soft)}
  .p-pro{background:var(--yellow);color:#000}
  .p-admin{background:var(--ok-bg);color:var(--ok)}
  .k-photo{background:var(--fill);color:var(--ink-2)}
  .k-recipe{background:var(--yellow-dim);color:var(--yellow-soft)}
  .k-reel{background:var(--yellow);color:#000}
  .link{color:var(--yellow);font-weight:800;cursor:pointer;background:none;border:0;font-size:13px}
  .sel{background:var(--fill);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-family:inherit;font-size:12.5px;font-weight:700;text-transform:capitalize}
  .sel:disabled{opacity:.55}
  .rowacts{display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .flash{color:var(--ok);font-size:12px;font-weight:800}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px}
  .kv .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .kv .v{font-size:15px;font-weight:800;margin-top:3px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .search{flex:1;min-width:180px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:var(--fill);color:var(--ink);font-family:inherit;font-size:13.5px}
  .search:focus{outline:none;border-color:var(--yellow)}
  .fbtn{background:var(--fill);border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:800;cursor:pointer}
  .fbtn[aria-pressed="true"]{background:var(--yellow);color:#000;border-color:var(--yellow)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;color:var(--muted);font-size:12.5px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 14px;font-size:17px;font-weight:1000}
  .modal .fld{margin-bottom:12px}
  .modal label{margin:0 0 5px}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .spin{padding:40px;text-align:center;color:var(--muted);font-size:13px}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- ============ sign in ============ -->
<div id="gate">
  <div class="card">
    <h1>Control room</h1>
    <p>Sign in with an admin goodiesSnap account.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn" id="go">Sign in</button>
    <div id="gerr" class="err hidden"></div>
  </div>
</div>

<!-- ============ dashboard ============ -->
<div id="app" class="shell hidden">
  <aside>
    <div class="brand"><div class="logo">g</div><div><b>goodiesSnap</b><small>Control room</small></div></div>
    <nav>
      <button data-v="overview" aria-current="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button data-v="users"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 6.5a3 3 0 0 1 0 6M17.5 20a5.5 5.5 0 0 0-2.2-4.4"/></svg>Members</button>
      <button data-v="posts"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><path d="M8 14h5"/></svg>Community</button>
      <button data-v="reports"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 16.5v.01"/></svg>Moderation</button>
      <button data-v="catalog"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 5.5v15"/></svg>Catalog</button>
      <button data-v="subs"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/></svg>Subscriptions</button>
      <button data-v="groups"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><circle cx="5.5" cy="17" r="2.6"/><circle cx="18.5" cy="17" r="2.6"/></svg>Groups</button>
      <button data-v="audit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h9M9 12h9M9 19h9"/><path d="M4.5 5h.01M4.5 12h.01M4.5 19h.01"/></svg>Audit log</button>
    </nav>
    <div class="spacer"></div>
    <div class="who">Signed in as<b id="whoName">—</b></div>
    <button class="out" id="out"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 12H3M6 8l-4 4 4 4"/></svg>Logout</button>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="title">Dashboard</h1>
        <p class="sub" id="subtitle">Live data from your backend</p>
      </div>
      <span class="chip"><span class="dot"></span>Live · all time</span>
      <div class="avatar" id="avatar">A</div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </main>
</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
let SESSION = null;

const api = async (path, opts = {}) => {
  const res = await fetch(GS.baseURL + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + (SESSION ? SESSION.accessToken : GS.anonKey),
      ...(opts.headers || {}),
    },
  });
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!res.ok) throw new Error((body && body.message) || `${res.status}`);
  return body;
};
const rows = (table, query = "") => api(`/api/database/records/${table}${query ? "?" + query : ""}`);

// Privileged mutations run through the server-side `admin` function, which re-checks
// is_admin before touching anything with the service key.
async function adminFn(payload) {
  const res = await fetch(GS.functionsURL + "/admin", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + SESSION.accessToken },
    body: JSON.stringify(payload),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok || d.error) throw new Error(d.error || `${res.status}`);
  return d;
}

// ---------- sign in ----------
async function signIn() {
  const email = $("#em").value.trim(), password = $("#pw").value;
  const err = $("#gerr");
  err.classList.add("hidden");
  $("#go").disabled = true; $("#go").textContent = "Signing in…";
  try {
    const r = await fetch(GS.baseURL + "/api/auth/sessions?client_type=web", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + GS.anonKey },
      body: JSON.stringify({ method: "password", email, password }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || "Sign-in failed");
    SESSION = { accessToken: d.accessToken, userID: d.user.id, name: d.user.name || email };

    // Authorisation is the server's call, not ours: ask for this profile and
    // check the flag the RLS policies key off.
    const me = await rows("profiles", `id=eq.${SESSION.userID}&select=display_name,is_admin&limit=1`);
    if (!me.length || !me[0].is_admin) throw new Error("That account is not an admin.");

    SESSION.name = me[0].display_name || SESSION.name;
    sessionStorage.setItem("gs_admin", JSON.stringify(SESSION));
    enter();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove("hidden");
  } finally {
    $("#go").disabled = false; $("#go").textContent = "Sign in";
  }
}

function enter() {
  $("#gate").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#whoName").textContent = SESSION.name;
  $("#avatar").textContent = (SESSION.name || "A").trim().charAt(0).toUpperCase() || "A";
  show("overview");
}

$("#go").addEventListener("click", signIn);
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });
$("#out").addEventListener("click", () => { sessionStorage.removeItem("gs_admin"); location.reload(); });

// ---------- helpers ----------
// Escapes for BOTH text nodes and double/single-quoted attribute values — several data-*
// attributes are built from user-controlled text (display names, ids), so quotes must be
// encoded too or a crafted name could break out of the attribute and inject script.
const esc = s => String(s ?? "").replace(/[<>&"']/g, c =>
  ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" }[c]));
const when = d => d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—";
const planPill = p => `<span class="pill p-${p || "free"}">${p || "free"}</span>`;
const dayKey = d => d.toISOString().slice(0, 10);

// Brief inline confirmation on a table row after an action.
function flash(tr, msg) {
  const cell = tr.querySelector(".rowacts") || tr.lastElementChild;
  const tag = document.createElement("span");
  tag.className = "flash"; tag.textContent = msg;
  cell.appendChild(tag);
  setTimeout(() => tag.remove(), 1600);
}

// Last 7 calendar days (oldest → today) with a short weekday label.
function last7() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    out.push({ key: dayKey(d), label: d.toLocaleDateString(undefined, { weekday: "short" }) });
  }
  return out;
}

// Bar chart from a [{key,label}] axis and a {key:count} map.
function barChart(axis, counts) {
  const max = Math.max(1, ...axis.map(a => counts[a.key] || 0));
  const today = axis[axis.length - 1].key;
  return `<div class="bars">${axis.map(a => {
    const v = counts[a.key] || 0;
    const h = Math.round((v / max) * 100);
    return `<div class="col"><div class="bar ${a.key === today ? "" : "soft"}" style="height:${Math.max(h, 3)}%" title="${v}"></div><div class="lbl">${a.label}</div></div>`;
  }).join("")}</div>`;
}

// SVG donut from [{label,value,color}].
function donut(segs, centerN, centerT) {
  const total = segs.reduce((s, x) => s + x.value, 0) || 1;
  const R = 78, C = 2 * Math.PI * R;
  let offset = 0;
  const rings = segs.filter(s => s.value > 0).map(s => {
    const len = (s.value / total) * C;
    const dash = `${len} ${C - len}`;
    const el = `<circle cx="95" cy="95" r="${R}" fill="none" stroke="${s.color}" stroke-width="26"
      stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 95 95)"
      stroke-linecap="butt"></circle>`;
    offset += len;
    return el;
  }).join("");
  return `<div class="donut">
    <svg viewBox="0 0 190 190" width="190" height="190">
      <circle cx="95" cy="95" r="78" fill="none" stroke="var(--fill)" stroke-width="26"></circle>
      ${rings}
    </svg>
    <div class="mid"><div><div class="n num">${centerN}</div><div class="t">${centerT}</div></div></div>
  </div>`;
}

// ---------- views ----------
const TITLES = {
  overview: ["Dashboard", "Live data from your backend"],
  users:    ["Members", "Accounts, plans and quota"],
  posts:    ["Community", "Posts people have shared"],
  reports:  ["Moderation", "Reported content awaiting a decision"],
  catalog:  ["Catalog", "The Discover recipe collection"],
  subs:     ["Subscriptions", "Apple subscription bindings"],
  groups:   ["Groups", "Community groups"],
  audit:    ["Audit log", "Every admin action, most recent first"],
};

// Money + time formatting shared across views.
const usd = micros => "$" + (Number(micros || 0) / 1_000_000).toFixed(2);
const ago = d => {
  if (!d) return "—";
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
};

document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.v)));

async function show(v) {
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.v === v)));
  $("#title").textContent = TITLES[v][0];
  $("#subtitle").textContent = TITLES[v][1];
  $("#view").innerHTML = `<div class="spin">Loading…</div>`;
  try { await VIEWS[v](); }
  catch (e) { $("#view").innerHTML = `<div class="card panel"><div class="empty">Couldn't load: ${e.message}</div></div>`; }
}

const VIEWS = {
  async overview() {
    const since = new Date(); since.setDate(since.getDate() - 6); since.setHours(0, 0, 0, 0);
    const prevSince = new Date(since); prevSince.setDate(prevSince.getDate() - 7);
    const [profiles, ents, posts, reports, usage, catalog, budget] = await Promise.all([
      rows("profiles", "select=id,created_at,display_name,is_admin&order=created_at.desc"),
      rows("entitlements", "select=user_id,plan").catch(() => []),
      rows("posts", "select=id,author_name,caption,kind,like_count,comment_count,created_at&order=created_at.desc&limit=100"),
      rows("content_reports", "select=id,reason,target_type,created_at&order=created_at.desc").catch(() => []),
      rows("ai_usage", `select=created_at,cost_micros,model,refunded&created_at=gte.${prevSince.toISOString()}`).catch(() => []),
      rows("catalog_recipes", "select=cuisine").catch(() => []),
      rows("image_search_budget", "order=day.desc&limit=1").catch(() => []),
    ]);

    // Member growth (last 7 days) + trend vs the 7 days before.
    const axis = last7();
    const signupsByDay = {};
    let new7 = 0, prev7 = 0;
    profiles.forEach(p => {
      if (!p.created_at) return;
      const t = new Date(p.created_at);
      if (t >= since) { const k = dayKey(new Date(p.created_at)); signupsByDay[k] = (signupsByDay[k] || 0) + 1; new7++; }
      else if (t >= prevSince) prev7++;
    });
    const trend = prev7 === 0 ? (new7 > 0 ? 100 : 0) : Math.round(((new7 - prev7) / prev7) * 100);
    const trendCls = trend >= 0 ? "up" : "down";
    const trendTxt = `${trend >= 0 ? "+" : ""}${trend}%`;

    // Plan mix (accounts with no entitlement row count as free).
    const byPlan = { free: 0, plus: 0, pro: 0 };
    const entByUser = Object.fromEntries(ents.map(e => [e.user_id, e.plan || "free"]));
    profiles.forEach(p => { const pl = entByUser[p.id] || "free"; byPlan[pl] = (byPlan[pl] || 0) + 1; });
    const totalMembers = profiles.length;
    const planSegs = [
      { label: "Free", value: byPlan.free, color: "#3A3320" },
      { label: "Plus", value: byPlan.plus, color: "var(--yellow-soft)" },
      { label: "Pro",  value: byPlan.pro,  color: "var(--yellow)" },
    ];
    const pct = v => totalMembers ? Math.round((v / totalMembers) * 100) : 0;

    // AI actions + spend in the last 7 days, and spend by model.
    const usage7 = usage.filter(u => new Date(u.created_at) >= since);
    const ai7 = usage7.length;
    const spend7 = usage7.reduce((s, u) => s + (u.refunded ? 0 : Number(u.cost_micros || 0)), 0);
    const byModel = {};
    usage7.forEach(u => { if (u.refunded) return; const m = u.model || "unknown"; byModel[m] = (byModel[m] || 0) + Number(u.cost_micros || 0); });
    const modelRows = Object.entries(byModel).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const modelMax = Math.max(1, ...modelRows.map(m => m[1]));
    const todayBudget = budget[0] ? budget[0].queries : 0;

    // Catalog by cuisine — top 6, as the alert-style bars.
    const cuisineCount = {};
    catalog.forEach(c => { const k = (c.cuisine || "Other").trim() || "Other"; cuisineCount[k] = (cuisineCount[k] || 0) + 1; });
    const topCuisines = Object.entries(cuisineCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const cuisineMax = Math.max(1, ...topCuisines.map(c => c[1]));

    const openReports = reports.length;
    const tile = (k, v, d = "", req = false) =>
      `<div class="card tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="d${req ? " req" : ""}">${d}</div></div>`;

    $("#view").innerHTML = `
      <div class="row two">
        <div class="card pad">
          <div class="cap">Member growth <span class="mut">· last 7 days</span></div>
          <div class="big num">${new7}</div>
          <div class="delta ${trendCls}">${trendTxt} vs previous 7 days</div>
          ${barChart(axis, signupsByDay)}
        </div>
        <div class="card pad">
          <div class="cap">Plan mix</div>
          <div class="donut-wrap" style="margin-top:8px">
            ${donut(planSegs, totalMembers, "Members")}
            <div class="legend">
              ${planSegs.map(s => `<div class="li"><span class="sw" style="background:${s.color}"></span>
                <span class="nm">${s.label}</span><span class="pc">${pct(s.value)}%</span></div>`).join("")}
              <div class="li"><span class="sw" style="background:var(--ok)"></span>
                <span class="nm">Paying</span><span class="pc">${pct(byPlan.plus + byPlan.pro)}%</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row tiles">
        ${tile("New members", new7, "last 7 days")}
        ${tile("Community posts", posts.length, "shared all time")}
        ${tile("AI spend", usd(spend7), `${ai7} actions · 7 days`)}
        ${tile("Open reports", openReports, openReports ? "action required" : "all clear", openReports > 0)}
      </div>

      <div class="row bottom">
        <div class="card panel">
          <div class="panel-h"><h2>Recent posts</h2><span class="note">${posts.length} total</span></div>
          <div class="tw"><table>
            <thead><tr><th>Author</th><th>Type</th><th>♥</th><th>When</th><th></th></tr></thead>
            <tbody>${posts.slice(0, 6).map(p => `<tr>
              <td><strong>${esc(p.author_name)}</strong><br><span style="color:var(--muted)">${esc((p.caption || "").slice(0, 60)) || "—"}</span></td>
              <td><span class="pill k-${esc(p.kind || "photo")}">${esc(p.kind || "post")}</span></td>

          </table></div>
        </div>

        <div class="card pad">
          <div class="cap" style="margin-bottom:16px">Catalog by cuisine</div>
          <div class="alerts">
            ${topCuisines.map(([name, n]) => `<div class="alert">
              <div class="top"><span>${esc(name)}</span><span class="r num">${n}</span></div>
              <div class="track"><span style="width:${Math.round((n / cuisineMax) * 100)}%"></span></div>
            </div>`).join("") || `<div class="empty">Catalog is empty</div>`}
          </div>
        </div>
      </div>

      <div class="row bottom">
        <div class="card pad">
          <div class="cap" style="margin-bottom:16px">AI spend by model <span class="mut">· 7 days</span></div>
          <div class="alerts">
            ${modelRows.map(([m, c]) => `<div class="alert">
              <div class="top"><span>${esc(m)}</span><span class="r num">${usd(c)}</span></div>
              <div class="track"><span style="width:${Math.round((c / modelMax) * 100)}%"></span></div>

          </div>
        </div>
        <div class="card pad">
          <div class="cap" style="margin-bottom:6px">Image-search budget <span class="mut">· today</span></div>
          <div class="big num">${todayBudget}</div>
          <div class="delta ${todayBudget >= 90 ? "down" : "up"}">Google CSE queries used today</div>
        </div>
      </div>`;

    document.querySelectorAll("[data-goto]").forEach(b =>
      b.addEventListener("click", () => show(b.dataset.goto)));
  },

  async reports() {
    const list = await rows("content_reports", "select=*&order=created_at.desc").catch(() => []);
    // Resolve the actual reported content so the admin can judge it, in 3 batched reads.
    const ids = t => [...new Set(list.filter(r => r[t]).map(r => r[t]))];
    const inList = a => a.length ? `id=in.(${a.join(",")})` : "id=eq.00000000-0000-0000-0000-000000000000";
    const [postRows, commentRows, reviewRows] = await Promise.all([
      ids("post_id").length ? rows("posts", `select=id,caption,author_name,hidden_at&${inList(ids("post_id"))}`).catch(() => []) : [],
      ids("comment_id").length ? rows("comments", `select=id,body,author_name,hidden_at&${inList(ids("comment_id"))}`).catch(() => []) : [],
      ids("review_id").length ? rows("recipe_reviews", `select=id,body,author_name,hidden_at&${inList(ids("review_id"))}`).catch(() => []) : [],
    ]);
    const map = rowsArr => Object.fromEntries(rowsArr.map(x => [x.id, x]));
    const P = map(postRows), C = map(commentRows), R = map(reviewRows);
    const target = r => {
      if (r.post_id) return { type: "post", id: r.post_id, obj: P[r.post_id] };
      if (r.comment_id) return { type: "comment", id: r.comment_id, obj: C[r.comment_id] };
      if (r.review_id) return { type: "review", id: r.review_id, obj: R[r.review_id] };
      return { type: r.target_type || "?", id: null, obj: null };
    };
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Reports</h2>
      <span class="note">${list.length} total</span></div><div class="tw"><table>
      <thead><tr><th>Reported content</th><th>Reason</th><th>When</th><th>Actions</th></tr></thead><tbody>
      ${list.map(r => {
        const t = target(r);
        const body = t.obj ? (t.obj.caption ?? t.obj.body ?? "") : "(deleted)";
        const author = t.obj ? t.obj.author_name : "";
        return `<tr data-rid="${r.id}" data-tt="${t.type}" data-tid="${t.id || ""}">
          <td><span class="pill k-${t.type === "post" ? "photo" : t.type === "review" ? "recipe" : "reel"}">${t.type}</span>
            ${t.obj && t.obj.hidden_at ? '<span class="pill k-photo">hidden</span>' : ""}
            <strong>${esc(author)}</strong><br><span style="color:var(--muted)">${esc((body || "").slice(0, 90)) || "—"}</span></td>
          <td>${esc(r.reason || "—")}${r.note ? `<br><span style="color:var(--muted)">${esc(r.note.slice(0, 60))}</span>` : ""}</td>
          <td class="num" style="color:var(--muted)">${when(r.created_at)}</td>
          <td class="rowacts">
            ${t.id && t.obj ? `<button class="link" data-hide="${t.obj.hidden_at ? "0" : "1"}">${t.obj.hidden_at ? "Unhide" : "Hide"}</button>
            <button class="btn danger" data-del>Delete</button>` : ""}
            <button class="link" data-dismiss>Dismiss</button>
          </td>
        </tr>`;
      }).join("") || `<tr><td colspan="4" class="empty">Nothing has been reported</td></tr>`}
      </tbody></table></div></div>`;

    document.querySelectorAll("[data-dismiss]").forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr"); b.disabled = true;
      try { await adminFn({ action: "delete_report", reportId: tr.dataset.rid }); tr.remove(); }
      catch (e) { alert("Couldn't dismiss: " + e.message); b.disabled = false; }
    }));
    document.querySelectorAll("[data-hide]").forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr"); b.disabled = true;
      try { await adminFn({ action: "hide_content", targetType: tr.dataset.tt, id: tr.dataset.tid, hidden: b.dataset.hide === "1" }); show("reports"); }
      catch (e) { alert("Couldn't update: " + e.message); b.disabled = false; }
    }));
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      if (!confirm("Permanently delete this content? Hiding is reversible; deleting is not.")) return;
      b.disabled = true; b.textContent = "Deleting…";
      try { await adminFn({ action: "delete_content", targetType: tr.dataset.tt, id: tr.dataset.tid }); show("reports"); }
      catch (e) { alert("Couldn't delete: " + e.message); b.disabled = false; b.textContent = "Delete"; }
    }));
  },

        const id = b.closest("tr").dataset.id;
        const full = await rows("catalog_recipes", `id=eq.${id}&limit=1`).catch(() => []);
        editRecipe(full[0] || { id });
      }));
      document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
        const tr = b.closest("tr");
        if (!confirm("Delete this catalog recipe permanently?")) return;
        b.disabled = true; b.textContent = "Deleting…";
        try { await adminFn({ action: "catalog_delete", id: tr.dataset.id }); tr.remove(); }
        catch (e) { alert("Couldn't delete: " + e.message); b.disabled = false; b.textContent = "Delete"; }
      }));
    };
    // Recipe add/edit modal — a focused subset of the columns; jsonb fields kept as-is on edit.
    const editRecipe = (r) => {
      modalForm(r && r.id && r.title ? "Edit recipe" : "Add recipe", [
        { name: "title", label: "Title", value: r?.title || "" },
        { name: "cuisine", label: "Cuisine", value: r?.cuisine || "" },
        { name: "category", label: "Category", value: r?.category || "" },
        { name: "image_url", label: "Image URL", value: r?.image_url || "" },
        { name: "servings", label: "Servings", type: "number", value: r?.servings ?? "" },
        { name: "prep_minutes", label: "Prep (min)", type: "number", value: r?.prep_minutes ?? "" },
        { name: "cook_minutes", label: "Cook (min)", type: "number", value: r?.cook_minutes ?? "" },
        { name: "notes", label: "Notes", value: r?.notes || "" },
      ], async (vals) => {
        const recipe = { ...(r && r.id ? { id: r.id } : {}), ...vals };
        ["servings", "prep_minutes", "cook_minutes"].forEach(k => { if (recipe[k] === "") delete recipe[k]; else recipe[k] = Number(recipe[k]); });
        await adminFn({ action: "catalog_upsert", recipe });
        render();
      });
    };
    render();
  },

  async subs() {
    const list = await rows("app_store_transactions",
      "select=user_id,product_id,plan,environment,expires_at,revoked_at,created_at&order=expires_at.desc&limit=200").catch(() => []);
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Subscriptions</h2>
      <span class="note">${list.length} total</span></div><div class="tw"><table>
      <thead><tr><th>Product</th><th>Plan</th><th>Env</th><th>Expires</th><th>Revoked</th></tr></thead><tbody>
      ${list.map(s => `<tr>
        <td><strong>${esc(s.product_id || "—")}</strong></td>
        <td>${planPill(s.plan)}</td>
        <td style="color:var(--muted)">${esc(s.environment || "—")}</td>
        <td class="num" style="color:var(--muted)">${when(s.expires_at)}</td>
        <td class="num" style="color:${s.revoked_at ? "var(--stop)" : "var(--muted)"}">${s.revoked_at ? when(s.revoked_at) : "—"}</td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">No subscriptions recorded</td></tr>`}
      </tbody></table></div></div>`;
  },

  async groups() {
    const list = await rows("groups", "select=id,name,slug,emoji,description,member_count,post_count&order=name.asc").catch(() => []);
    $("#view").innerHTML = `
      <div class="toolbar"><div style="flex:1"></div><button class="btn" id="addGroup">+ Add group</button></div>
      <div class="card panel"><div class="panel-h"><h2>Community groups</h2><span class="note">${list.length}</span></div>
      <div class="tw"><table>
      <thead><tr><th>Group</th><th>Slug</th><th>Members</th><th>Posts</th><th>Actions</th></tr></thead><tbody>
      ${list.map(g => `<tr data-id="${g.id}">
        <td>${esc(g.emoji || "")} <strong>${esc(g.name)}</strong><br><span style="color:var(--muted)">${esc((g.description || "").slice(0, 60))}</span></td>
        <td style="color:var(--muted)">${esc(g.slug || "—")}</td>
        <td class="num">${g.member_count ?? 0}</td>
        <td class="num">${g.post_count ?? 0}</td>
        <td class="rowacts"><button class="link" data-edit>Edit</button><button class="btn danger" data-del>Delete</button></td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">No groups</td></tr>`}
      </tbody></table></div></div>`;

    const edit = g => modalForm(g ? "Edit group" : "Add group", [
      { name: "name", label: "Name", value: g?.name || "" },
      { name: "slug", label: "Slug", value: g?.slug || "" },
      { name: "emoji", label: "Emoji", value: g?.emoji || "" },
      { name: "description", label: "Description", value: g?.description || "" },
    ], async vals => { await adminFn({ action: "group_upsert", ...(g ? { id: g.id } : {}), ...vals }); show("groups"); });

    $("#addGroup").addEventListener("click", () => edit(null));
    document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
      const g = list.find(x => x.id === b.closest("tr").dataset.id); edit(g);
    }));
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      const tr = b.closest("tr");
      if (!confirm("Delete this group?")) return;
      b.disabled = true;
      try { await adminFn({ action: "group_delete", id: tr.dataset.id }); tr.remove(); }
      catch (e) { alert("Couldn't delete: " + e.message); b.disabled = false; }
    }));
  },

  async audit() {
    const list = await rows("admin_audit", "select=*&order=created_at.desc&limit=200").catch(() => []);
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Admin actions</h2>
      <span class="note">${list.length} shown</span></div><div class="tw"><table>
      <thead><tr><th>Admin</th><th>Action</th><th>Target</th><th>Detail</th><th>When</th></tr></thead><tbody>
      ${list.map(a => `<tr>
        <td><strong>${esc(a.actor_name || "—")}</strong></td>
        <td><span class="pill k-recipe">${esc(a.action)}</span></td>
        <td style="color:var(--muted)">${esc(a.target_type || "")} ${esc((a.target_id || "").slice(0, 8))}</td>
        <td style="color:var(--muted)">${esc(JSON.stringify(a.detail || {}).slice(0, 60))}</td>
        <td class="num" style="color:var(--muted)">${ago(a.created_at)}</td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">No admin actions logged yet</td></tr>`}
      </tbody></table></div></div>`;
  },
};

// A small modal form. fields: [{name,label,type?,value?}]. Calls onSave(values) then closes.
function modalForm(title, fields, onSave) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>
    ${fields.map(f => `<div class="fld"><label>${esc(f.label)}</label>
      <input class="search" data-n="${esc(f.name)}" type="${f.type || "text"}" value="${esc(f.value ?? "")}" style="width:100%"></div>`).join("")}
    <div class="foot"><button class="btn ghost" data-cancel>Cancel</button><button class="btn" data-save>Save</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", e => { if (e.target === bg) close(); });
  bg.querySelector("[data-cancel]").addEventListener("click", close);
  bg.querySelector("[data-save]").addEventListener("click", async () => {
    const vals = {};
    bg.querySelectorAll("[data-n]").forEach(i => { vals[i.dataset.n] = i.value; });
    const save = bg.querySelector("[data-save]"); save.disabled = true; save.textContent = "Saving…";
    try { await onSave(vals); close(); }
    catch (e) { alert("Couldn't save: " + e.message); save.disabled = false; save.textContent = "Save"; }
  });
}

// Per-user detail: plan/quota levers, their posts, AI usage and subscription.
async function openUserDetail(uid, name) {
  $("#title").textContent = name || "Member";
  $("#subtitle").textContent = "Member detail";
  $("#view").innerHTML = `<div class="spin">Loading…</div>`;
  const [ent, posts, usage, subs, prof] = await Promise.all([
    rows("entitlements", `user_id=eq.${uid}&select=plan,used,top_up,trial_until,period&limit=1`).catch(() => []),
    rows("posts", `author_id=eq.${uid}&select=id,caption,kind,like_count,hidden_at,created_at&order=created_at.desc&limit=50`).catch(() => []),
    rows("ai_usage", `user_id=eq.${uid}&select=action,model,cost_micros,refunded,created_at&order=created_at.desc&limit=20`).catch(() => []),
    rows("app_store_transactions", `user_id=eq.${uid}&select=product_id,plan,environment,expires_at,revoked_at&order=expires_at.desc&limit=5`).catch(() => []),
    rows("profiles", `id=eq.${uid}&select=display_name,is_admin,created_at&limit=1`).catch(() => []),
  ]);
  const e = ent[0] || {}, p = prof[0] || {};
  const spend = usage.reduce((s, u) => s + (u.refunded ? 0 : Number(u.cost_micros || 0)), 0);
  const info = (k, v) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`;
  $("#view").innerHTML = `
    <button class="link" id="backUsers">← Back to members</button>
    <div class="card pad" style="margin-top:12px">
      <div class="cap">${esc(p.display_name || name)} ${p.is_admin ? '<span class="pill p-admin">admin</span>' : ""}</div>
      <div class="kv" style="margin-top:14px">
        ${info("Plan", planPill(e.plan))}
        ${info("Used this period", `<span class="num">${e.used ?? 0}</span>`)}
        ${info("Top-up", `<span class="num">${e.top_up ?? 0}</span>`)}
        ${info("Trial", e.trial_until ? when(e.trial_until) : "—")}
        ${info("Joined", when(p.created_at))}
      </div>
      <div class="rowacts" style="justify-content:flex-start;flex-wrap:wrap;margin-top:16px;gap:8px">
        <button class="btn ghost" data-act="top10">+10 actions</button>
        <button class="btn ghost" data-act="top50">+50 actions</button>
        <button class="btn ghost" data-act="reset">Reset quota</button>
        <button class="btn ghost" data-act="trial7">Trial 7d</button>
        <button class="btn ghost" data-act="trial30">Trial 30d</button>
        <button class="btn ghost" data-act="trial0">Clear trial</button>
      </div>
    </div>

    <div class="row bottom" style="margin-top:14px">
      <div class="card panel">
        <div class="panel-h"><h2>Their posts</h2><span class="note">${posts.length}</span></div>
        <div class="tw"><table><thead><tr><th>Caption</th><th>Type</th><th>♥</th><th>When</th></tr></thead>
        <tbody>${posts.map(x => `<tr>
          <td>${esc((x.caption || "").slice(0, 50)) || "—"} ${x.hidden_at ? '<span class="pill k-photo">hidden</span>' : ""}</td>
          <td><span class="pill k-${esc(x.kind || "photo")}">${esc(x.kind || "post")}</span></td>
          <td class="num">${x.like_count ?? 0}</td><td class="num" style="color:var(--muted)">${when(x.created_at)}</td>
        </tr>`).join("") || `<tr><td colspan="4" class="empty">No posts</td></tr>`}</tbody></table></div>
      </div>
      <div class="card panel">
        <div class="panel-h"><h2>AI usage</h2><span class="note">${usd(spend)} shown</span></div>
        <div class="tw"><table><thead><tr><th>Action</th><th>Model</th><th>Cost</th><th>When</th></tr></thead>
        <tbody>${usage.map(u => `<tr>
          <td>${esc(u.action || "—")}${u.refunded ? ' <span class="pill p-free">refunded</span>' : ""}</td>
          <td style="color:var(--muted)">${esc(u.model || "—")}</td>
          <td class="num">${usd(u.cost_micros)}</td><td class="num" style="color:var(--muted)">${ago(u.created_at)}</td>
        </tr>`).join("") || `<tr><td colspan="4" class="empty">No AI usage</td></tr>`}</tbody></table></div>
      </div>
    </div>

    <div class="card panel" style="margin-top:14px">
      <div class="panel-h"><h2>Subscriptions</h2><span class="note">${subs.length}</span></div>
      <div class="tw"><table><thead><tr><th>Product</th><th>Plan</th><th>Env</th><th>Expires</th><th>Revoked</th></tr></thead>
      <tbody>${subs.map(s => `<tr>
        <td>${esc(s.product_id || "—")}</td><td>${planPill(s.plan)}</td>
        <td style="color:var(--muted)">${esc(s.environment || "—")}</td>
        <td class="num" style="color:var(--muted)">${when(s.expires_at)}</td>
        <td class="num" style="color:var(--muted)">${s.revoked_at ? when(s.revoked_at) : "—"}</td>
      </tr>`).join("") || `<tr><td colspan="5" class="empty">No subscriptions</td></tr>`}</tbody></table></div>
    </div>`;

  $("#backUsers").addEventListener("click", () => show("users"));
  const run = async (payload, label) => {
    try { await adminFn(payload); openUserDetail(uid, name); }
    catch (e) { alert(`${label} failed: ` + e.message); }
  };
  const acts = {
    top10: () => run({ action: "add_top_up", userId: uid, amount: 10 }, "Top-up"),
    top50: () => run({ action: "add_top_up", userId: uid, amount: 50 }, "Top-up"),
    reset: () => run({ action: "reset_quota", userId: uid }, "Reset"),
    trial7: () => run({ action: "set_trial", userId: uid, days: 7 }, "Trial"),
    trial30: () => run({ action: "set_trial", userId: uid, days: 30 }, "Trial"),
    trial0: () => run({ action: "set_trial", userId: uid, days: 0 }, "Trial"),
  };
  document.querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", () => acts[b.dataset.act]()));
}

// resume a session within this tab
const saved = sessionStorage.getItem("gs_admin");
if (saved) { try { SESSION = JSON.parse(saved); enter(); } catch { sessionStorage.removeItem("gs_admin"); } }
</script>
