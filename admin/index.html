<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>goodiesSnap Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800;6..12,1000&display=swap">
<style>
  :root{
    --ink:#14110A; --ink-2:#413A29; --muted:#8A8172;
    --paper:#F7F4EA; --card:#FFFFFF; --fill:#F3ECD9;
    --line:#E5DDC6; --line-soft:#F0E9D6;
    --yellow:#FFC400; --amber:#8F6300; --black:#0B0A06;
    --ok:#2E7D46; --ok-bg:#E4F2E8;
    --warn:#9C6410; --warn-bg:#FBF1DF;
    --stop:#AE3326; --stop-bg:#FBECEA;
    --shadow:0 1px 2px rgba(20,17,10,.05), 0 8px 22px rgba(20,17,10,.05);
    --sans:"Nunito Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F4F0E4; --ink-2:#CBC3AE; --muted:#968F7E;
      --paper:#100E09; --card:#1A170F; --fill:#221D13;
      --line:#302A1C; --line-soft:#241F14;
      --amber:#EFC15C; --ok:#63C182; --ok-bg:#16301F;
      --warn:#E0A85A; --warn-bg:#2E2413; --stop:#F08373; --stop-bg:#331915;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit}
  a{color:var(--amber)}

  /* sign-in */
  #gate{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  #gate .card{width:100%;max-width:380px;padding:28px}
  #gate h1{font-size:22px;font-weight:1000;margin:0 0 4px;letter-spacing:-.02em}
  #gate p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 0 5px}
  input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--fill);color:var(--ink);font-size:14.5px;font-family:inherit}
  input:focus{outline:none;border-color:var(--ink)}
  .btn{border:0;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:5px 12px}
  .btn.danger{background:transparent;border:1px solid var(--stop);color:var(--stop);font-size:12px;padding:5px 12px}
  #gate .btn{width:100%;margin-top:20px}
  .err{margin-top:12px;font-size:13px;color:var(--stop);background:var(--stop-bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}

  /* shell */
  .shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
  aside{background:var(--black);padding:20px 14px;position:sticky;top:0;height:100vh}
  .brand{color:var(--yellow);font-weight:1000;font-size:16px;padding:0 10px}
  .brand small{display:block;color:#7C7566;font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:22px}
  nav button{all:unset;cursor:pointer;padding:9px 11px;border-radius:9px;color:#CFC8B6;font-size:13.5px;font-weight:600}
  nav button:hover{background:rgba(255,255,255,.06);color:#fff}
  nav button[aria-current="true"]{background:var(--yellow);color:#000;font-weight:800}
  aside .who{color:#6E6858;font-size:11px;padding:14px 10px;margin-top:20px;border-top:1px solid rgba(255,255,255,.08)}
  aside .who b{color:#CFC8B6;display:block;font-size:12px}
  main{padding:24px 26px 60px;min-width:0}
  @media (max-width:820px){ .shell{grid-template-columns:1fr} aside{position:static;height:auto} nav{flex-direction:row;flex-wrap:wrap} main{padding:18px 14px 40px} }

  h1.page{font-size:24px;font-weight:1000;letter-spacing:-.025em;margin:0}
  .sub{color:var(--muted);font-size:13.5px;margin:2px 0 20px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .tile{padding:15px 16px}
  .tile .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
  .tile .v{font-size:26px;font-weight:1000;letter-spacing:-.02em;margin-top:5px}
  .tile .d{font-size:12.5px;color:var(--muted)}

  .panel{margin-bottom:16px;overflow:hidden}
  .panel-h{padding:13px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
  .panel-h h2{font-size:14.5px;font-weight:800;margin:0}
  .panel-h .note{margin-left:auto;font-size:12px;color:var(--muted)}
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
  th,td{padding:10px 18px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--fill)}
  tbody tr:last-child td{border-bottom:0}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
  .p-free{background:var(--fill);color:var(--ink-2)}
  .p-plus{background:var(--yellow);color:#000}
  .p-pro{background:var(--black);color:var(--yellow)}
  .p-admin{background:var(--ok-bg);color:var(--ok)}
  .empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .spin{padding:30px;text-align:center;color:var(--muted);font-size:13px}
  .hidden{display:none!important}
</style>
</head>
<body>

<!-- ============ sign in ============ -->
<div id="gate">
  <div class="card">
    <h1>Control room</h1>
    <p>Sign in with an admin goodiesSnap account.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" placeholder="you@example.com">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn" id="go">Sign in</button>
    <div id="gerr" class="err hidden"></div>
  </div>
</div>

<!-- ============ dashboard ============ -->
<div id="app" class="shell hidden">
  <aside>
    <div class="brand">goodiesSnap<small>Control room</small></div>
    <nav>
      <button data-v="overview" aria-current="true">Overview</button>
      <button data-v="users" aria-current="false">Users</button>
      <button data-v="posts" aria-current="false">Community</button>
      <button data-v="reports" aria-current="false">Moderation</button>
      <button data-v="catalog" aria-current="false">Catalog</button>
    </nav>
    <div class="who">Signed in as<b id="whoName">—</b><button class="btn ghost" id="out" style="margin-top:10px">Sign out</button></div>
  </aside>

  <main>
    <h1 class="page" id="title">Overview</h1>
    <p class="sub" id="subtitle">Live data from your backend</p>
    <div id="view"></div>
  </main>
</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
let SESSION = null;

const api = async (path, opts = {}) => {
  const res = await fetch(GS.baseURL + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + (SESSION ? SESSION.accessToken : GS.anonKey),
      ...(opts.headers || {}),
    },
  });
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!res.ok) throw new Error((body && body.message) || `${res.status}`);
  return body;
};
const rows = (table, query = "") => api(`/api/database/records/${table}${query ? "?" + query : ""}`);

// ---------- sign in ----------
async function signIn() {
  const email = $("#em").value.trim(), password = $("#pw").value;
  const err = $("#gerr");
  err.classList.add("hidden");
  $("#go").disabled = true; $("#go").textContent = "Signing in…";
  try {
    const r = await fetch(GS.baseURL + "/api/auth/sessions?client_type=web", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + GS.anonKey },
      body: JSON.stringify({ method: "password", email, password }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || "Sign-in failed");
    SESSION = { accessToken: d.accessToken, userID: d.user.id, name: d.user.name || email };

    // Authorisation is the server's call, not ours: ask for this profile and
    // check the flag the RLS policies key off.
    const me = await rows("profiles", `id=eq.${SESSION.userID}&select=display_name,is_admin&limit=1`);
    if (!me.length || !me[0].is_admin) throw new Error("That account is not an admin.");

    SESSION.name = me[0].display_name || SESSION.name;
    sessionStorage.setItem("gs_admin", JSON.stringify(SESSION));
    enter();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove("hidden");
  } finally {
    $("#go").disabled = false; $("#go").textContent = "Sign in";
  }
}

function enter() {
  $("#gate").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#whoName").textContent = SESSION.name;
  show("overview");
}

$("#go").addEventListener("click", signIn);
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });
$("#out").addEventListener("click", () => { sessionStorage.removeItem("gs_admin"); location.reload(); });

// ---------- views ----------
const TITLES = {
  overview: ["Overview", "Live data from your backend"],
  users:    ["Users", "Every account and its plan"],
  posts:    ["Community", "Posts people have shared"],
  reports:  ["Moderation", "Reported content awaiting a decision"],
  catalog:  ["Catalog", "The Discover recipe collection"],
};

document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => show(b.dataset.v)));

async function show(v) {
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-current", String(b.dataset.v === v)));
  $("#title").textContent = TITLES[v][0];
  $("#subtitle").textContent = TITLES[v][1];
  $("#view").innerHTML = `<div class="spin">Loading…</div>`;
  try { await VIEWS[v](); }
  catch (e) { $("#view").innerHTML = `<div class="card panel"><div class="empty">Couldn't load: ${e.message}</div></div>`; }
}

const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const when = d => d ? new Date(d).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—";
const planPill = p => `<span class="pill p-${p || "free"}">${p || "free"}</span>`;

const VIEWS = {
  async overview() {
    const [profiles, posts, reports, ents, usage, cat] = await Promise.all([
      rows("profiles", "select=id"), rows("posts", "select=id"),
      rows("content_reports", "select=id,resolved_at").catch(() => []),
      rows("entitlements", "select=plan").catch(() => []),
      rows("ai_usage", "select=id").catch(() => []),
      rows("catalog_recipes", "select=id"),
    ]);
    const open = reports.filter(r => !r.resolved_at).length;
    const paid = ents.filter(e => e.plan && e.plan !== "free").length;
    const tile = (k, v, d = "") => `<div class="card tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="d">${d}</div></div>`;
    $("#view").innerHTML = `
      <div class="tiles">
        ${tile("Accounts", profiles.length)}
        ${tile("Paying", paid, paid ? "" : "no paid plans yet")}
        ${tile("Posts", posts.length)}
        ${tile("Open reports", open, open ? "needs review" : "all clear")}
        ${tile("AI actions", usage.length, "all time")}
        ${tile("Catalog", cat.length, "recipes in Discover")}
      </div>
      <div class="card panel">
        <div class="panel-h"><h2>Where the data comes from</h2></div>
        <div class="empty" style="text-align:left;padding:18px">
          Every number above is read live from your backend as the signed-in admin.
          There is no service key in this page — row-level security decides what you
          can see, and only a profile with <code>is_admin = true</code> can read across accounts.
        </div>
      </div>`;
  },

  async users() {
    const [profiles, ents] = await Promise.all([
      rows("profiles", "select=id,display_name,created_at,is_admin&order=created_at.desc"),
      rows("entitlements", "select=user_id,plan,used").catch(() => []),
    ]);
    const byUser = Object.fromEntries(ents.map(e => [e.user_id, e]));
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Accounts</h2>
      <span class="note">${profiles.length} total</span></div><div class="tw"><table>
      <thead><tr><th>Name</th><th>Plan</th><th>Used</th><th>Joined</th></tr></thead><tbody>
      ${profiles.map(p => {
        const e = byUser[p.id];
        return `<tr>
          <td><strong>${esc(p.display_name) || "—"}</strong> ${p.is_admin ? '<span class="pill p-admin">admin</span>' : ""}</td>
          <td>${planPill(e && e.plan)}</td>
          <td class="num">${e ? e.used ?? 0 : 0}</td>
          <td class="num" style="color:var(--muted)">${when(p.created_at)}</td>
        </tr>`;
      }).join("") || `<tr><td colspan="4" class="empty">No accounts yet</td></tr>`}
      </tbody></table></div></div>`;
  },

  async posts() {
    const list = await rows("posts", "select=id,author_name,caption,kind,like_count,comment_count,created_at&order=created_at.desc&limit=100");
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Posts</h2>
      <span class="note">${list.length} shown</span></div><div class="tw"><table>
      <thead><tr><th>Post</th><th>Kind</th><th>♥</th><th>Replies</th><th>When</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr data-id="${p.id}">
        <td><strong>${esc(p.author_name)}</strong><br><span style="color:var(--muted)">${esc((p.caption || "").slice(0, 90)) || "—"}</span></td>
        <td>${esc(p.kind || "post")}</td>
        <td class="num">${p.like_count ?? 0}</td>
        <td class="num">${p.comment_count ?? 0}</td>
        <td class="num" style="color:var(--muted)">${when(p.created_at)}</td>
        <td><button class="btn danger" data-del="${p.id}">Remove</button></td>
      </tr>`).join("") || `<tr><td colspan="6" class="empty">No posts yet</td></tr>`}
      </tbody></table></div></div>`;
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("Remove this post permanently?")) return;
      b.disabled = true; b.textContent = "Removing…";
      try {
        await api(`/api/database/records/posts?id=eq.${b.dataset.del}`, { method: "DELETE" });
        b.closest("tr").remove();
      } catch (e) { alert("Couldn't remove: " + e.message); b.disabled = false; b.textContent = "Remove"; }
    }));
  },

  async reports() {
    const list = await rows("content_reports", "select=*&order=created_at.desc").catch(() => []);
    const open = list.filter(r => !r.resolved_at);
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Reports</h2>
      <span class="note">${open.length} open of ${list.length}</span></div><div class="tw"><table>
      <thead><tr><th>Reason</th><th>Target</th><th>When</th><th>Status</th></tr></thead><tbody>
      ${list.map(r => `<tr>
        <td><strong>${esc(r.reason || "—")}</strong></td>
        <td style="color:var(--muted)">${esc(r.post_id || r.target_id || "—")}</td>
        <td class="num" style="color:var(--muted)">${when(r.created_at)}</td>
        <td>${r.resolved_at ? '<span class="pill p-admin">resolved</span>' : '<span class="pill p-plus">open</span>'}</td>
      </tr>`).join("") || `<tr><td colspan="4" class="empty">Nothing has been reported</td></tr>`}
      </tbody></table></div></div>`;
  },

  async catalog() {
    const list = await rows("catalog_recipes", "select=id,title,cuisine&order=title.asc&limit=200");
    $("#view").innerHTML = `<div class="card panel"><div class="panel-h"><h2>Discover catalog</h2>
      <span class="note">first ${list.length}</span></div><div class="tw"><table>
      <thead><tr><th>Recipe</th><th>Cuisine</th></tr></thead><tbody>
      ${list.map(r => `<tr><td>${esc(r.title)}</td><td class="num" style="color:var(--muted)">${esc(r.cuisine || "—")}</td></tr>`).join("")
        || `<tr><td colspan="2" class="empty">Catalog is empty</td></tr>`}
      </tbody></table></div></div>`;
  },
};

// resume a session within this tab
const saved = sessionStorage.getItem("gs_admin");
if (saved) { try { SESSION = JSON.parse(saved); enter(); } catch { sessionStorage.removeItem("gs_admin"); } }
</script>
</body>
</html>
